name: popchoice-observability

services:
  observability-prometheus:
    image: prom/prometheus:v3.7.3
    container_name: popchoice-observability-prometheus
    restart: unless-stopped
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--config.expand-env',
        '--storage.tsdb.path=/prometheus',
        '--storage.tsdb.retention.time=15d',
        '--web.enable-lifecycle',
      ]
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      POPCHOICE_WEB_METRICS_TARGET: ${POPCHOICE_WEB_METRICS_TARGET:-web:3000}
      POPCHOICE_WORKERS_METRICS_TARGET: ${POPCHOICE_WORKERS_METRICS_TARGET:-workers:9464}
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - default
      - popchoice-app
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/ready || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  observability-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: popchoice-observability-cadvisor
    restart: unless-stopped
    command: ['--docker_only=true', '--housekeeping_interval=30s']
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  observability-node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: popchoice-observability-node-exporter
    restart: unless-stopped
    command:
      [
        '--path.rootfs=/host',
        '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)',
      ]
    pid: host
    volumes:
      - /:/host:ro,rslave

  observability-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    container_name: popchoice-observability-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_DATA_SOURCE_URI:-db:5432/popchoice?sslmode=disable}
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_DATA_SOURCE_USER:-popchoice}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_DATA_SOURCE_PASS:-}
    networks:
      - default
      - popchoice-app

  observability-redis-exporter:
    image: oliver006/redis_exporter:v1.80.1
    container_name: popchoice-observability-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_REDIS_ADDR:-redis://redis:6379}
    networks:
      - default
      - popchoice-app

  observability-uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: popchoice-observability-uptime-kuma
    restart: unless-stopped
    ports:
      - '127.0.0.1:3002:3001'
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001'').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  observability-loki:
    image: grafana/loki:3.5.7
    container_name: popchoice-observability-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  observability-alloy:
    image: grafana/alloy:v1.11.3
    container_name: popchoice-observability-alloy
    restart: unless-stopped
    command:
      [
        'run',
        '--server.http.listen-addr=0.0.0.0:12345',
        '--storage.path=/var/lib/alloy/data',
        '/etc/alloy/config.alloy',
      ]
    ports:
      - '127.0.0.1:12345:12345'
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      observability-loki:
        condition: service_healthy

  observability-grafana:
    image: grafana/grafana:12.3.0
    container_name: popchoice-observability-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting observability}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      observability-loki:
        condition: service_healthy
      observability-prometheus:
        condition: service_healthy

volumes:
  alloydata:
  grafanadata:
  lokidata:
  prometheusdata:
  uptime-kuma-data:

networks:
  popchoice-app:
    name: ${POPCHOICE_APP_NETWORK:-popchoice_default}
    external: true
