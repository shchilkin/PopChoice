name: Bump Version

on:
  push:
    branches: ['development']

permissions:
  contents: write

concurrency:
  group: bump-version-development
  cancel-in-progress: false

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Commit and push version update
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump version [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:development; then
                echo "Push succeeded on attempt ${attempt}"
                exit 0
              fi

              if [ "${attempt}" -eq 3 ]; then
                echo "Push failed after ${attempt} attempts"
                exit 1
              fi

              echo "Push failed due to remote updates, re-syncing with origin/development"
              git fetch origin development
              if ! git rebase origin/development; then
                git rebase --abort || true
                echo "Rebase failed while re-syncing with origin/development"
                exit 1
              fi
            done
          fi
