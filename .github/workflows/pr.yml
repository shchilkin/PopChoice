name: PR

on:
  pull_request:
    branches: ['development']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify pull request changes
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const isDocumentationFile = (filename) =>
              filename.startsWith('docs/') || /^[^/]+\.md$/.test(filename);
            const docsOnly =
              files.length > 0 && files.every((file) => isDocumentationFile(file.filename));

            core.info(`Changed files: ${files.length}`);
            core.info(`Docs-only pull request: ${docsOnly}`);
            core.setOutput('docs_only', docsOnly ? 'true' : 'false');

  lint:
    name: Lint & Format
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint:check

      - name: Check Prettier formatting
        run: npm run format:check

  type-check:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  fallow-audit:
    name: Fallow Audit
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Fallow audit
        run: npm run quality:fallow:audit -- --changed-since origin/development --format compact

  server-tests:
    name: Server Tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server tests with coverage
        run: npm run test:server -- --coverage --run

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 30

  backoffice-tests:
    name: Backoffice Tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backoffice tests
        run: npm run test:backoffice

  recommendation-evals:
    name: Recommendation Evals
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic recommendation evals
        run: npm run eval:recommendations

      - name: Upload recommendation eval report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recommendation-eval-report
          path: apps/web/test-results/recommendation-evals/
          retention-days: 30

  storybook-tests:
    name: Storybook Tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Install Playwright browsers
        run: npx playwright install
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run Storybook tests
        run: npm run test:storybook --ignore-scripts

  e2e-tests:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Stop e2e services
        if: always()
        run: npm run test:e2e:down

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            apps/web/playwright-report/
            test-results/
            apps/web/test-results/
          retention-days: 30

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_FONT_GOOGLE_DISABLE: 1
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  docs-build:
    name: Docs Build
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check docs
        run: npm run type-check:docs

      - name: Build docs
        run: npm run build:docs
        env:
          NEXT_TELEMETRY_DISABLED: 1

  services-ci:
    name: Services CI
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test services
        run: npm run test:services

  dependency-review:
    name: Dependency Review
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  pr-validation:
    name: PR Validation
    if: always()
    needs:
      - changes
      - lint
      - fallow-audit
      - type-check
      - server-tests
      - backoffice-tests
      - recommendation-evals
      - storybook-tests
      - e2e-tests
      - build
      - docs-build
      - services-ci
      - dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      LINT_RESULT: ${{ needs.lint.result }}
      FALLOW_AUDIT_RESULT: ${{ needs.fallow-audit.result }}
      TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
      SERVER_TESTS_RESULT: ${{ needs.server-tests.result }}
      BACKOFFICE_TESTS_RESULT: ${{ needs.backoffice-tests.result }}
      RECOMMENDATION_EVALS_RESULT: ${{ needs.recommendation-evals.result }}
      STORYBOOK_TESTS_RESULT: ${{ needs.storybook-tests.result }}
      E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DOCS_BUILD_RESULT: ${{ needs.docs-build.result }}
      SERVICES_CI_RESULT: ${{ needs.services-ci.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
    steps:
      - name: Validate workflow outcome
        run: |
          if [[ "$DOCS_ONLY" == "true" ]]; then
            if [[ "$DOCS_BUILD_RESULT" != "success" ]]; then
              echo "Docs-only pull request detected, but Docs Build did not pass: $DOCS_BUILD_RESULT"
              exit 1
            fi
            echo "Docs-only pull request detected. Full app CI jobs were intentionally skipped, and Docs Build passed."
            exit 0
          fi

          failures=()

          [[ "$LINT_RESULT" == "success" ]] || failures+=("Lint & Format: $LINT_RESULT")
          [[ "$FALLOW_AUDIT_RESULT" == "success" ]] || failures+=("Fallow Audit: $FALLOW_AUDIT_RESULT")
          [[ "$TYPE_CHECK_RESULT" == "success" ]] || failures+=("Type Check: $TYPE_CHECK_RESULT")
          [[ "$SERVER_TESTS_RESULT" == "success" ]] || failures+=("Server Tests: $SERVER_TESTS_RESULT")
          [[ "$BACKOFFICE_TESTS_RESULT" == "success" ]] || failures+=("Backoffice Tests: $BACKOFFICE_TESTS_RESULT")
          [[ "$RECOMMENDATION_EVALS_RESULT" == "success" ]] || failures+=("Recommendation Evals: $RECOMMENDATION_EVALS_RESULT")
          [[ "$STORYBOOK_TESTS_RESULT" == "success" ]] || failures+=("Storybook Tests: $STORYBOOK_TESTS_RESULT")
          [[ "$E2E_TESTS_RESULT" == "success" ]] || failures+=("E2E Tests: $E2E_TESTS_RESULT")
          [[ "$BUILD_RESULT" == "success" ]] || failures+=("Build: $BUILD_RESULT")
          [[ "$DOCS_BUILD_RESULT" == "success" ]] || failures+=("Docs Build: $DOCS_BUILD_RESULT")
          [[ "$SERVICES_CI_RESULT" == "success" ]] || failures+=("Services CI: $SERVICES_CI_RESULT")
          [[ "$DEPENDENCY_REVIEW_RESULT" == "success" ]] || failures+=("Dependency Review: $DEPENDENCY_REVIEW_RESULT")

          if [[ ${#failures[@]} -gt 0 ]]; then
            printf '%s\n' "One or more required CI jobs did not pass:" "${failures[@]}"
            exit 1
          fi

          echo "All required CI jobs passed for a non-doc pull request."
