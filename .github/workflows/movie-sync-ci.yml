name: Movie Sync CI

on:
  pull_request:
    branches: ['development']
    paths:
      - 'services/movie-sync/**'
      - '.github/workflows/movie-sync-ci.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  movie-sync-ci:
    name: Movie Sync CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/movie-sync
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/movie-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build
