name: Container Images

on:
  pull_request:
    branches: ['development']
  push:
    branches: ['development']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions: {}

jobs:
  build-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: workers
            dockerfile: apps/web/workers.Dockerfile
          - name: bull-board
            dockerfile: apps/web/bull-board.Dockerfile
          - name: storybook
            dockerfile: apps/web/storybook.Dockerfile
          - name: backoffice
            dockerfile: apps/backoffice/Dockerfile
          - name: docs
            dockerfile: apps/docs/Dockerfile
          - name: db-migrate
            dockerfile: services/db-migrate/Dockerfile
          - name: movie-seed
            dockerfile: services/movie-seed/Dockerfile
          - name: movie-discovery
            dockerfile: services/movie-discovery/Dockerfile
          - name: movie-backfill
            dockerfile: services/movie-backfill/Dockerfile
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: meta
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          image_namespace="${GITHUB_REPOSITORY,,}"
          image_repository="${REGISTRY}/${image_namespace}/${IMAGE_NAME}"
          commit_sha="${GITHUB_SHA}"
          short_sha="${commit_sha::12}"
          pull_request_number_json="null"
          if [[ -n "${PR_NUMBER}" ]]; then
            pull_request_number_json="\"${PR_NUMBER}\""
          fi

          {
            echo "image_repository=${image_repository}"
            echo "commit_sha=${commit_sha}"
            echo "source_commit_sha=${PR_HEAD_SHA:-$commit_sha}"
            echo "source_ref=${PR_HEAD_REF:-$GITHUB_REF_NAME}"
            echo "image_tag=sha-${short_sha}"
            echo "pull_request_number_json=${pull_request_number_json}"
            echo "tags<<EOF"
            echo "${image_repository}:sha-${short_sha}"
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "${image_repository}:pr-${PR_NUMBER}"
            fi
            if [[ "${GITHUB_REF_NAME}" == "development" && ( "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ) ]]; then
              echo "${image_repository}:development"
            fi
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=PopChoice ${IMAGE_NAME}"
            echo "org.opencontainers.image.description=PopChoice ${IMAGE_NAME} production image"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${commit_sha}"
            echo "org.opencontainers.image.ref.name=${GITHUB_REF_NAME}"
            echo "io.popchoice.image.role=${IMAGE_NAME}"
            echo "io.popchoice.github.repository=${GITHUB_REPOSITORY}"
            echo "io.popchoice.github.run_id=${GITHUB_RUN_ID}"
            echo "io.popchoice.github.run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "io.popchoice.github.workflow=${GITHUB_WORKFLOW}"
            echo "io.popchoice.github.pr_number=${PR_NUMBER}"
            echo "io.popchoice.github.source_revision=${PR_HEAD_SHA:-$commit_sha}"
            echo "io.popchoice.github.source_ref=${PR_HEAD_REF:-$GITHUB_REF_NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
            APP_GIT_BRANCH=${{ github.ref_name }}
            APP_PR_NUMBER=${{ env.PR_NUMBER }}
            APP_IMAGE_REPOSITORY=${{ steps.meta.outputs.image_repository }}
            APP_IMAGE_TAG=${{ steps.meta.outputs.image_tag }}
            SOURCE_COMMIT=${{ steps.meta.outputs.source_commit_sha }}
            SOURCE_BRANCH=${{ steps.meta.outputs.source_ref }}
            GITHUB_SHA=${{ steps.meta.outputs.commit_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Write image digest artifact
        if: env.PUSH_IMAGE == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          SOURCE_COMMIT_SHA: ${{ steps.meta.outputs.source_commit_sha }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
          PULL_REQUEST_NUMBER_JSON: ${{ steps.meta.outputs.pull_request_number_json }}
        run: |
          mkdir -p artifacts
          cat > "artifacts/${IMAGE_NAME}.json" <<EOF
          {
            "name": "${IMAGE_NAME}",
            "image": "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}",
            "repository": "${IMAGE_REPOSITORY}",
            "tag": "${IMAGE_TAG}",
            "digest": "${IMAGE_DIGEST}",
            "commitSha": "${COMMIT_SHA}",
            "sourceCommitSha": "${SOURCE_COMMIT_SHA}",
            "sourceRef": "${SOURCE_REF}",
            "pullRequestNumber": ${PULL_REQUEST_NUMBER_JSON},
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF

      - name: Upload image digest artifact
        if: env.PUSH_IMAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: container-image-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}.json
          retention-days: 30

  deploy-coolify:
    name: Trigger Coolify deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'development'
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
      POPCHOICE_PRODUCTION_BASE_URL: ${{ secrets.POPCHOICE_PRODUCTION_BASE_URL }}
      EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout deploy scripts
        if: env.COOLIFY_DEPLOY_WEBHOOK != '' && env.COOLIFY_TOKEN != ''
        uses: actions/checkout@v6

      - name: Validate Coolify deploy secrets
        if: env.COOLIFY_DEPLOY_WEBHOOK != '' && env.COOLIFY_TOKEN == ''
        run: |
          echo "COOLIFY_DEPLOY_WEBHOOK is configured but COOLIFY_TOKEN is missing."
          echo "Create a Coolify API token with deploy permission and save it as the COOLIFY_TOKEN repository secret."
          exit 1

      - name: Create Grafana deploy silence
        if: env.COOLIFY_DEPLOY_WEBHOOK != '' && env.COOLIFY_TOKEN != ''
        run: scripts/create-grafana-deploy-silence.sh

      - name: Trigger Coolify deploy webhook
        if: env.COOLIFY_DEPLOY_WEBHOOK != '' && env.COOLIFY_TOKEN != ''
        run: |
          curl -fsS --request GET "${COOLIFY_DEPLOY_WEBHOOK}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

      - name: Verify production recovered
        if: env.COOLIFY_DEPLOY_WEBHOOK != '' && env.COOLIFY_TOKEN != ''
        run: scripts/verify-production-deploy.sh

      - name: Skip deploy when webhook is not configured
        if: env.COOLIFY_DEPLOY_WEBHOOK == ''
        run: echo "COOLIFY_DEPLOY_WEBHOOK is not configured; images were published but deployment was not triggered."
