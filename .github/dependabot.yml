# Dependabot configuration for PopChoice
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor npm dependencies in package.json
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    assignees:
      - 'shchilkin'
    labels:
      - 'dependencies'
      - 'automated'
      - 'npm'
    allow:
      - dependency-type: 'all'
    groups:
      framework:
        applies-to: version-updates
        patterns:
          - 'next'
          - 'next-themes'
          - 'react'
          - 'react-dom'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      ai:
        applies-to: version-updates
        patterns:
          - 'openai'
          - 'langchain'
          - '@langchain/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      database:
        applies-to: version-updates
        patterns:
          - 'pg'
          - '@supabase/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      ui-utilities:
        applies-to: version-updates
        patterns:
          - 'canvas-confetti'
          - 'react-canvas-confetti'
          - 'zod'
          - 'serve'
          - '@vercel/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      typescript-types:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - 'typescript'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      linting-formatting:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'sort-package-json'
          - 'lint-staged'
        update-types:
          - 'minor'
          - 'patch'
      testing:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'playwright'
          - 'msw'
        update-types:
          - 'minor'
          - 'patch'
      storybook:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - 'storybook'
          - '@storybook/*'
          - '@chromatic-com/*'
          - 'msw-storybook-addon'
        update-types:
          - 'minor'
          - 'patch'
      build-tools:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'husky'
          - 'tsx'
        update-types:
          - 'minor'
          - 'patch'
      dev-misc:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      npm-security-patches:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'

  # Monitor npm dependencies in services/movie-seed
  - package-ecosystem: 'npm'
    directory: '/services/movie-seed'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    assignees:
      - 'shchilkin'
    labels:
      - 'dependencies'
      - 'automated'
      - 'npm'
    allow:
      - dependency-type: 'all'
    groups:
      movie-seed-production:
        applies-to: version-updates
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      movie-seed-development:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      movie-seed-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'

  # Monitor npm dependencies in services/movie-discovery
  - package-ecosystem: 'npm'
    directory: '/services/movie-discovery'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    assignees:
      - 'shchilkin'
    labels:
      - 'dependencies'
      - 'automated'
      - 'npm'
    allow:
      - dependency-type: 'all'
    groups:
      movie-discovery-production:
        applies-to: version-updates
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      movie-discovery-development:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      movie-discovery-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'

  # Monitor GitHub Actions in workflows
  - package-ecosystem: 'github-actions'
    directory: '/.github/workflows'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    assignees:
      - 'shchilkin'
    labels:
      - 'dependencies'
      - 'automated'
      - 'github-actions'
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'
