services:
  e2e-db:
    image: pgvector/pgvector:pg16
    container_name: popchoice-e2e-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: popchoice_e2e
      POSTGRES_DB: popchoice_e2e
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U popchoice_e2e -d popchoice_e2e']
      interval: 5s
      timeout: 5s
      retries: 10

  e2e-redis:
    image: redis:7-alpine
    container_name: popchoice-e2e-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
