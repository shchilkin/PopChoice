services:
  db:
    image: pgvector/pgvector:pg16
    container_name: popchoice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # gitguardian:ignore
      POSTGRES_DB: ${POSTGRES_DB:-popchoice}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d popchoice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
