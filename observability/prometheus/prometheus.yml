global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - observability-prometheus:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - observability-cadvisor:8080

  - job_name: node
    static_configs:
      - targets:
          - observability-node-exporter:9100

  - job_name: postgres
    static_configs:
      - targets:
          - observability-postgres-exporter:9187

  - job_name: redis
    static_configs:
      - targets:
          - observability-redis-exporter:9121

  - job_name: popchoice-web
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/popchoice-metrics-bearer-token
    static_configs:
      - targets:
          - ${POPCHOICE_WEB_METRICS_TARGET}

  - job_name: popchoice-workers
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/popchoice-metrics-bearer-token
    static_configs:
      - targets:
          - ${POPCHOICE_WORKERS_METRICS_TARGET}
