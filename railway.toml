[[services]]
name = "web"

[services.build]
buildCommand = "npm ci && npm run build --workspace=apps/web"

[services.deploy]
startCommand = "npm run start --workspace=apps/web"

[[services]]
name = "workers"

[services.build]
buildCommand = "npm ci"

[services.deploy]
startCommand = "npm run start:workers --workspace=apps/web"

[[services]]
name = "bull-board"

[services.build]
buildCommand = "npm ci"

[services.deploy]
startCommand = "npm run bull-board --workspace=apps/web"

[[services]]
name = "storybook"

[services.build]
dockerfilePath = "apps/web/storybook.Dockerfile"
