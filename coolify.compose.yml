x-app-env: &app-env
  NODE_ENV: production
  POSTGRES_USER: ${POSTGRES_USER:-popchoice}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
  POSTGRES_DB: ${POSTGRES_DB:-popchoice}
  SERVICE_NAME_DB: ${SERVICE_NAME_DB:-db}
  SERVICE_NAME_REDIS: ${SERVICE_NAME_REDIS:-redis}
  DATABASE_URL: postgresql://${POSTGRES_USER:-popchoice}:${POSTGRES_PASSWORD:?missing}@${SERVICE_NAME_DB:-db}:5432/${POSTGRES_DB:-popchoice}
  REDIS_URL: redis://${SERVICE_NAME_REDIS:-redis}:6379
  APP_VERSION: ${APP_VERSION:-0.1.0-beta.0}
  APP_CHANNEL: ${APP_CHANNEL:-beta}
  APP_COMMIT_SHA: ${APP_COMMIT_SHA:-${SOURCE_COMMIT:-}}
  APP_GIT_BRANCH: ${APP_GIT_BRANCH:-${SOURCE_BRANCH:-}}
  SOURCE_COMMIT: ${SOURCE_COMMIT:-}
  SOURCE_BRANCH: ${SOURCE_BRANCH:-}
  COOLIFY_BRANCH: ${COOLIFY_BRANCH:-}
  COOLIFY_RESOURCE_UUID: ${COOLIFY_RESOURCE_UUID:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in Coolify}
  TMDB_API_KEY: ${TMDB_API_KEY:-}
  NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL to the public app URL in Coolify}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
  TRACING_ENABLED: ${TRACING_ENABLED:-false}
  TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.05}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://observability-otel-collector:4318/v1/traces}
  API_KEY_HMAC_SECRET: ${API_KEY_HMAC_SECRET:-}
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Set AUTH_SESSION_SECRET in Coolify}
  VALID_API_KEYS: ${VALID_API_KEYS:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popchoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${POSTGRES_DB:-popchoice}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      default:
        aliases:
          - redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/web:${IMAGE_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    command:
      [
        'sh',
        '-lc',
        'export DATABASE_URL="postgresql://$${POSTGRES_USER:-popchoice}:$${POSTGRES_PASSWORD:?missing}@$${SERVICE_NAME_DB:-db}:5432/$${POSTGRES_DB:-popchoice}" REDIS_URL="redis://$${SERVICE_NAME_REDIS:-redis}:6379"; exec npm run start:with-migrations --workspace=apps/web',
      ]
    environment:
      <<: *app-env
      NODE_OPTIONS: --require /app/apps/web/scripts/coolify-runtime-env.cjs
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  workers:
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/workers:${IMAGE_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    command:
      [
        'sh',
        '-lc',
        'export DATABASE_URL="postgresql://$${POSTGRES_USER:-popchoice}:$${POSTGRES_PASSWORD:?missing}@$${SERVICE_NAME_DB:-db}:5432/$${POSTGRES_DB:-popchoice}" REDIS_URL="redis://$${SERVICE_NAME_REDIS:-redis}:6379"; exec npm run start:workers --workspace=apps/web',
      ]
    environment:
      <<: *app-env
      NODE_OPTIONS: --require /app/apps/web/scripts/coolify-runtime-env.cjs
      WORKER_METRICS_PORT: 9464
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '9464'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const pg=require(''pg''); const Redis=require(''ioredis''); const dbUrl=''postgresql://''+(process.env.POSTGRES_USER||''popchoice'')+'':''+process.env.POSTGRES_PASSWORD+''@''+(process.env.SERVICE_NAME_DB||''db'')+'':5432/''+(process.env.POSTGRES_DB||''popchoice''); const redisUrl=''redis://''+(process.env.SERVICE_NAME_REDIS||''redis'')+'':6379''; const pool=new pg.Pool({connectionString:dbUrl,connectionTimeoutMillis:2000,max:1}); const redis=new Redis(redisUrl,{maxRetriesPerRequest:null,connectTimeout:2000,lazyConnect:true}); Promise.all([pool.query(''SELECT 1''),redis.connect().then(()=>redis.ping())]).then(()=>process.exit(0)).catch(()=>process.exit(1)).finally(()=>Promise.allSettled([pool.end(),redis.quit()]))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bull-board:
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/bull-board:${IMAGE_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    command:
      [
        'sh',
        '-lc',
        'export REDIS_URL="redis://$${SERVICE_NAME_REDIS:-redis}:6379"; exec node_modules/.bin/tsx apps/web/scripts/bull-board.ts',
      ]
    environment:
      SERVICE_NAME_REDIS: ${SERVICE_NAME_REDIS:-redis}
      REDIS_URL: redis://${SERVICE_NAME_REDIS:-redis}:6379
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPERATOR_AUTH_REQUIRED: ${OPERATOR_AUTH_REQUIRED:-0}
      OPERATOR_AUTH_USERNAME: ${OPERATOR_AUTH_USERNAME:-}
      OPERATOR_AUTH_PASSWORD: ${OPERATOR_AUTH_PASSWORD:-}
      OPERATOR_AUTH_REALM: ${OPERATOR_AUTH_REALM:-PopChoice Operators}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backoffice:
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/backoffice:${IMAGE_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    command: ['npm', 'run', 'start', '--workspace=apps/backoffice']
    environment:
      <<: *app-env
      PORT: 3000
      OPERATOR_AUTH_REQUIRED: ${OPERATOR_AUTH_REQUIRED:-0}
      OPERATOR_AUTH_USERNAME: ${OPERATOR_AUTH_USERNAME:-}
      OPERATOR_AUTH_PASSWORD: ${OPERATOR_AUTH_PASSWORD:-}
      OPERATOR_AUTH_REALM: ${OPERATOR_AUTH_REALM:-PopChoice Operators}
      OPERATOR_AUTH_RATE_LIMIT_MAX: ${OPERATOR_AUTH_RATE_LIMIT_MAX:-30}
      OPERATOR_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${OPERATOR_AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      CATALOG_HEALTH_SAMPLE_LIMIT: ${CATALOG_HEALTH_SAMPLE_LIMIT:-5}
      CATALOG_HEALTH_STALE_DAYS: ${CATALOG_HEALTH_STALE_DAYS:-180}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  docs:
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/docs:${IMAGE_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    command:
      [
        'npm',
        'run',
        'start',
        '--workspace=apps/docs',
        '--',
        '--hostname',
        '0.0.0.0',
        '--port',
        '3000',
      ]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/docs'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  movie-seed:
    profiles: ['tools']
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/movie-seed:${IMAGE_TAG:-development}
    pull_policy: always
    restart: 'no'
    command:
      [
        'sh',
        '-lc',
        'export DATABASE_URL="postgresql://$${POSTGRES_USER:-popchoice}:$${POSTGRES_PASSWORD:?missing}@$${SERVICE_NAME_DB:-db}:5432/$${POSTGRES_DB:-popchoice}" REDIS_URL="redis://$${SERVICE_NAME_REDIS:-redis}:6379"; exec node dist/index.js',
      ]
    environment:
      <<: *app-env
      DRY_RUN: ${DRY_RUN:-false}
    depends_on:
      db:
        condition: service_healthy

  movie-discovery:
    profiles: ['discovery']
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/movie-discovery:${IMAGE_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    command:
      [
        'sh',
        '-lc',
        'export DATABASE_URL="postgresql://$${POSTGRES_USER:-popchoice}:$${POSTGRES_PASSWORD:?missing}@$${SERVICE_NAME_DB:-db}:5432/$${POSTGRES_DB:-popchoice}" REDIS_URL="redis://$${SERVICE_NAME_REDIS:-redis}:6379"; exec node dist/index.js',
      ]
    environment:
      <<: *app-env
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 0 * * 0}
      TMDB_SOURCES: ${TMDB_SOURCES:-}
      MAX_PAGES_PER_SOURCE: ${MAX_PAGES_PER_SOURCE:-3}
      MIN_VOTE_COUNT: ${MIN_VOTE_COUNT:-500}
      MIN_VOTE_AVERAGE: ${MIN_VOTE_AVERAGE:-6.5}
      MAX_MOVIES_PER_RUN: ${MAX_MOVIES_PER_RUN:-50}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en-US}
      DRY_RUN: ${DRY_RUN:-false}
    depends_on:
      db:
        condition: service_healthy

  movie-backfill:
    profiles: ['tools']
    image: ${APP_IMAGE_PREFIX:-ghcr.io/shchilkin/popchoice}/movie-backfill:${IMAGE_TAG:-development}
    pull_policy: always
    restart: 'no'
    environment:
      <<: *app-env
      DRY_RUN: ${DRY_RUN:-false}
      BATCH_SIZE: ${BATCH_SIZE:-5}
      MAX_MOVIES: ${MAX_MOVIES:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
